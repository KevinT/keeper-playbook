<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a0a0a">
  <title>Keeper Playbook</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <div class="progress" aria-hidden="true"><div class="progress__fill" id="progress-fill"></div></div>

  <header class="topbar" id="topbar">
    <a class="wordmark" id="wordmark" href="#home">Keeper Playbook</a>
    <nav class="topnav" id="topnav" aria-label="Main"></nav>
    <button class="burger" id="burger" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="drawer">
      <span></span><span></span><span></span>
    </button>
  </header>

  <div class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer__scrim" id="drawer-scrim"></div>
    <nav class="drawer__panel" id="drawer-nav" aria-label="Main"></nav>
  </div>

  <main id="main" class="main"></main>

  <footer class="footer">
    <span class="footer__mark" id="footer-mark">Keeper Playbook</span>
    <span class="footer__status" id="footer-status"></span>
    <button class="link-btn" id="reset-progress" type="button">Reset progress</button>
  </footer>

  <!-- Three tiers (see ARCHITECTURE.md). Plain script tags; order matters. -->
  <!-- site + levels -->
  <script src="site.js"></script>
  <script src="levels.js"></script>
  <!-- runtime foundations -->
  <script src="runtime/dom.js"></script>
  <script src="runtime/progress.js"></script>
  <script src="runtime/journey.js"></script>
  <!-- capabilities (versioned engines; no content inside) -->
  <script src="capabilities/prose.js"></script>
  <script src="capabilities/loop.js"></script>
  <script src="capabilities/cards.js"></script>
  <script src="capabilities/tabs.js"></script>
  <script src="capabilities/phases.js"></script>
  <script src="capabilities/vocab.js"></script>
  <script src="capabilities/quote.js"></script>
  <script src="capabilities/callout.js"></script>
  <script src="capabilities/tree.js"></script>
  <script src="capabilities/calls.js"></script>
  <script src="capabilities/pitch.js"></script>
  <script src="capabilities/quiz.js"></script>
  <script src="capabilities/checklist.js"></script>
  <script src="capabilities/ladder.js"></script>
  <script src="capabilities/review.js"></script>
  <script src="capabilities/field.js"></script>
  <script src="capabilities/drill.js"></script>
  <script src="capabilities/simulator.js"></script>
  <!-- packs: the registry is the ONLY place a pack is listed; each entry's pack.js is loaded from it in order -->
  <script src="packs/registry.js"></script>
  <script>
    (function () {
      var reg = (window.KP && window.KP.registry) || [];
      for (var i = 0; i < reg.length; i++) {
        if (!reg[i] || !reg[i].path) continue;
        document.write('<script src="' + String(reg[i].path).replace(/"/g, '') + '"><\/script>');
      }
    })();
  </script>
  <!-- runtime: boot, router, views -->
  <script src="runtime/app.js"></script>
</body>
</html>
